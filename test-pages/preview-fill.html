<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>极速海投 · 文字填入测试</title><style>body{font:16px/1.7 system-ui;margin:36px;max-width:760px;color:#25324a}h1{font-size:24px}label{display:block;margin:16px 0}input,textarea,[contenteditable]{display:block;box-sizing:border-box;border:1px solid #bbc7d8;border-radius:8px;padding:10px;width:100%;font:inherit}input:focus,textarea:focus,[contenteditable]:focus{outline:2px solid #3288fc}p{color:#6c7a8f}#events{font-size:13px;color:#25814d}main{max-width:480px}@media(max-width:400px){body{margin:16px}}</style><main><h1>文字填入测试</h1><p>仅本地测试，无提交按钮，也不发送表单数据。</p><label>普通文本<input id="plain" placeholder="先点击这里，再双击插件里的信息"></label><label>多行文本<textarea id="multiline" rows="3"></textarea></label><label>日期<input id="date" type="date"></label><label>只读字段<input id="readonly" value="只读内容应保留" readonly></label><label>密码字段<input id="password" type="password" value="fixture-only"></label><label>富文本编辑区<div contenteditable="true" id="rich">原始文字</div></label><p id="events" role="status">尚未收到填写事件</p></main><script>let count=0;document.addEventListener('input',event=>{document.querySelector('#events').textContent='收到 input 事件 '+(++count)+' 次 · 控件 '+event.target.id;});</script></html>
